name: Sync GrowsmartSMB → Supabase

on:
  # Run automatically every 6 hours (IST-friendly times)
  schedule:
    - cron: '0 */6 * * *'

  # Also allow running manually from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

jobs:
  sync:
    name: Scrape & Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install project dependencies ──────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Playwright Chromium browser ────────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── 5. Run the scraper ────────────────────────────────────────────────
      - name: Run GrowsmartSMB sync
        env:
          PORTAL_EMAIL:        ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD:     ${{ secrets.PORTAL_PASSWORD }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-growsmart.mjs

      # ── 6. Upload screenshots on failure (helps debug) ────────────────────
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-failure-screenshots
          path: |
            *.png
            screenshots/
          retention-days: 3
